<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SyncSticky Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f0f0f0;
      background-image: radial-gradient(#ddd 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      transition: background 0.5s ease;
    }

    #fab-add {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: #333;
      color: white;
      border-radius: 50%;
      text-align: center;
      line-height: 55px;
      font-size: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      user-select: none;
      z-index: 1000;
      transition: transform 0.2s;
    }
    #fab-add:hover { transform: scale(1.1); background: #555; }

    #fab-settings {
      position: fixed;
      bottom: 90px;
      right: 25px;
      width: 50px;
      height: 50px;
      background: white;
      color: #333;
      border-radius: 50%;
      text-align: center;
      line-height: 50px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      user-select: none;
      z-index: 1000;
      transition: transform 0.2s;
    }
    #fab-settings:hover { transform: scale(1.1); background: #eee; }

    #settings-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 20000;
      width: 320px;
      text-align: left;
      font-family: sans-serif;
    }

    #settings-modal h3 { margin-top: 0; color: #333; text-align: center; }
    #settings-modal h4 { margin: 15px 0 5px 0; font-size: 14px; color: #555; }

    #settings-modal input[type="text"] {
      width: 95%;
      padding: 8px;
      margin-bottom: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #settings-modal input[type="file"] {
      width: 100%;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .btn-group {
      text-align: center;
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }

    #settings-modal button {
      padding: 8px 12px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
    }
    #btn-save-bg { background-color: #4CAF50; color: white; }
    #btn-clear-bg { background-color: #f44336; color: white; }
    #btn-close-bg { background-color: #888; color: white; }

    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 19999;
    }
  </style>
</head>
<body>
  <div id="fab-add" title="Add sticky note">+</div>
  <div id="fab-settings" title="Background settings">BG</div>

  <div id="modal-overlay"></div>
  <div id="settings-modal">
    <h3>Background Settings</h3>

    <h4>Option A: Upload image</h4>
    <input type="file" id="bg-file-input" accept="image/*">
    <p style="font-size: 11px; color: #999; margin: 2px 0;">Images are saved locally in this browser. Maximum size: 5 MB.</p>

    <hr style="border: 0; border-top: 1px dashed #ddd; margin: 15px 0;">

    <h4>Option B: Image URL</h4>
    <input type="text" id="bg-url-input" placeholder="Enter image URL...">

    <div class="btn-group">
      <button id="btn-save-bg">Save URL</button>
      <button id="btn-clear-bg">Clear</button>
      <button id="btn-close-bg">Close</button>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
