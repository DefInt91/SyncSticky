<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SyncSticky Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --dash-ink: #20231f;
      --dash-muted: #60675f;
      --dash-paper: #f6f2e8;
      --dash-panel: rgba(255,255,255,0.78);
      --dash-line: rgba(32,35,31,0.14);
      --dash-charcoal: #232522;
      --dash-teal: #0f766e;
      --dash-amber: #c98219;
      --dash-rust: #a33a2f;
      --dash-moss: #687a3d;
    }

    body {
      background-color: var(--dash-paper);
      background-image:
        linear-gradient(rgba(32,35,31,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32,35,31,0.04) 1px, transparent 1px);
      background-size: 22px 22px;
      background-attachment: fixed;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--dash-ink);
      font-family: "Bahnschrift", "Aptos", "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(120deg, rgba(15,118,110,0.1), transparent 34%),
        linear-gradient(315deg, rgba(201,130,25,0.14), transparent 38%);
      mix-blend-mode: multiply;
    }

    #dashboard-shell {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      box-sizing: border-box;
    }

    #dashboard-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      padding: 12px 14px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--dash-line);
      border-radius: 8px;
      box-shadow: 0 14px 32px rgba(32,35,31,0.12);
      backdrop-filter: blur(10px);
    }

    #dashboard-title {
      margin: 0;
      color: var(--dash-ink);
      font-size: 22px;
      line-height: 1.2;
      font-weight: 900;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .toolbar-btn {
      border: 1px solid var(--dash-charcoal);
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 800;
      background: var(--dash-charcoal);
      color: white;
      min-height: 36px;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .toolbar-btn:hover {
      transform: translateY(-1px);
      background: #111310;
    }

    .toolbar-btn.secondary {
      background: white;
      color: var(--dash-charcoal);
      border: 1px solid var(--dash-line);
      min-width: 44px;
    }

    #todo-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      min-height: 0;
      flex-grow: 1;
    }

    .todo-column {
      background: var(--dash-panel);
      border: 1px solid var(--dash-line);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(32,35,31,0.1);
      backdrop-filter: blur(8px);
    }

    .todo-column[data-status="discussion"] { border-top: 5px solid var(--dash-amber); }
    .todo-column[data-status="waiting"] { border-top: 5px solid var(--dash-rust); }
    .todo-column[data-status="doing"] { border-top: 5px solid var(--dash-teal); }
    .todo-column[data-status="done"] { border-top: 5px solid var(--dash-moss); }

    .todo-column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--dash-line);
      font-weight: 900;
      color: var(--dash-ink);
      text-transform: uppercase;
      font-size: 13px;
    }

    .todo-count {
      font-size: 12px;
      color: var(--dash-muted);
      font-weight: 700;
      text-transform: none;
    }

    .todo-list {
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      flex-grow: 1;
    }

    .todo-list-over {
      outline: 2px dashed rgba(15,118,110,0.55);
      outline-offset: -6px;
      background: rgba(15,118,110,0.08);
    }

    .todo-card {
      background: #fff7b1;
      color: var(--dash-ink);
      border: 1px solid rgba(32,35,31,0.16);
      border-radius: 8px;
      box-shadow: 0 9px 22px rgba(32,35,31,0.16);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .todo-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(32,35,31,0.18);
    }

    .todo-content {
      min-height: 64px;
      max-height: 160px;
      overflow-y: auto;
      outline: none;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .todo-content:focus {
      background: rgba(255,255,255,0.24);
      border-radius: 6px;
    }

    .todo-content:empty::before {
      content: "Empty note";
      color: #777;
    }

    .todo-meta {
      color: var(--dash-muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .todo-actions {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
    }

    .todo-status {
      width: 100%;
      min-width: 0;
      height: 28px;
      border: 1px solid rgba(32,35,31,0.18);
      border-radius: 6px;
      background: rgba(255,255,255,0.62);
      color: var(--dash-ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .todo-action-btn {
      border: 1px solid rgba(32,35,31,0.18);
      background: rgba(255,255,255,0.66);
      color: var(--dash-ink);
      border-radius: 6px;
      cursor: pointer;
      min-width: 36px;
      height: 28px;
      font-size: 12px;
      font-weight: 800;
    }

    .todo-action-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    #settings-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 18px 42px rgba(0,0,0,0.28);
      z-index: 20000;
      width: 320px;
      text-align: left;
      font-family: "Bahnschrift", "Aptos", "Segoe UI", sans-serif;
    }

    #settings-modal h3 { margin-top: 0; color: var(--dash-ink); text-align: center; }
    #settings-modal h4 { margin: 15px 0 5px 0; font-size: 14px; color: var(--dash-muted); }

    #settings-modal input[type="text"] {
      width: 95%;
      padding: 8px;
      margin-bottom: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #settings-modal input[type="file"] {
      width: 100%;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .btn-group {
      text-align: center;
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }

    #settings-modal button {
      padding: 8px 12px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
    }
    #btn-save-bg { background-color: #0f766e; color: white; }
    #btn-clear-bg { background-color: #a33a2f; color: white; }
    #btn-close-bg { background-color: #666; color: white; }

    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 19999;
    }
  </style>
</head>
<body>
  <main id="dashboard-shell">
    <header id="dashboard-toolbar">
      <h1 id="dashboard-title">SyncSticky Todo</h1>
      <div class="toolbar-actions">
        <button class="toolbar-btn" id="btn-add-note" type="button">Add Note</button>
        <button class="toolbar-btn secondary" id="fab-settings" type="button">BG</button>
      </div>
    </header>

    <section id="todo-board">
      <section class="todo-column" data-status="discussion">
        <div class="todo-column-header"><span>Discussion</span><span class="todo-count" data-count="discussion">0</span></div>
        <div class="todo-list" data-list="discussion"></div>
      </section>
      <section class="todo-column" data-status="waiting">
        <div class="todo-column-header"><span>Waiting</span><span class="todo-count" data-count="waiting">0</span></div>
        <div class="todo-list" data-list="waiting"></div>
      </section>
      <section class="todo-column" data-status="doing">
        <div class="todo-column-header"><span>Doing</span><span class="todo-count" data-count="doing">0</span></div>
        <div class="todo-list" data-list="doing"></div>
      </section>
      <section class="todo-column" data-status="done">
        <div class="todo-column-header"><span>Done</span><span class="todo-count" data-count="done">0</span></div>
        <div class="todo-list" data-list="done"></div>
      </section>
    </section>
  </main>

  <div id="modal-overlay"></div>
  <div id="settings-modal">
    <h3>Background Settings</h3>

    <h4>Option A: Upload image</h4>
    <input type="file" id="bg-file-input" accept="image/*">
    <p style="font-size: 11px; color: #999; margin: 2px 0;">Images are saved locally in this browser. Maximum size: 5 MB.</p>

    <hr style="border: 0; border-top: 1px dashed #ddd; margin: 15px 0;">

    <h4>Option B: Image URL</h4>
    <input type="text" id="bg-url-input" placeholder="Enter image URL...">

    <div class="btn-group">
      <button id="btn-save-bg">Save URL</button>
      <button id="btn-clear-bg">Clear</button>
      <button id="btn-close-bg">Close</button>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
