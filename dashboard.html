<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SyncSticky Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f0f0f0;
      background-image: radial-gradient(#ddd 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.5s ease;
      font-family: Arial, sans-serif;
    }

    #dashboard-shell {
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }

    #dashboard-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    #dashboard-title {
      margin: 0;
      color: #222;
      font-size: 22px;
      line-height: 1.2;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .toolbar-btn {
      border: none;
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: bold;
      background: #333;
      color: white;
    }

    .toolbar-btn.secondary {
      background: white;
      color: #333;
      border: 1px solid #ccc;
    }

    #todo-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      min-height: 0;
      flex-grow: 1;
    }

    .todo-column {
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .todo-column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      font-weight: bold;
      color: #222;
    }

    .todo-count {
      font-size: 12px;
      color: #666;
      font-weight: normal;
    }

    .todo-list {
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      flex-grow: 1;
    }

    .todo-list-over {
      outline: 2px dashed rgba(0,0,0,0.35);
      outline-offset: -6px;
      background: rgba(255,255,255,0.35);
    }

    .todo-card {
      background: #fff7b1;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-content {
      min-height: 64px;
      max-height: 160px;
      overflow-y: auto;
      outline: none;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .todo-content:empty::before {
      content: "Empty note";
      color: #888;
    }

    .todo-meta {
      color: #666;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .todo-actions {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
    }

    .todo-status {
      width: 100%;
      min-width: 0;
      font-size: 12px;
    }

    .todo-action-btn {
      border: 1px solid rgba(0,0,0,0.16);
      background: rgba(255,255,255,0.7);
      border-radius: 6px;
      cursor: pointer;
      min-width: 32px;
      height: 28px;
      font-size: 12px;
    }

    #settings-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 20000;
      width: 320px;
      text-align: left;
      font-family: sans-serif;
    }

    #settings-modal h3 { margin-top: 0; color: #333; text-align: center; }
    #settings-modal h4 { margin: 15px 0 5px 0; font-size: 14px; color: #555; }

    #settings-modal input[type="text"] {
      width: 95%;
      padding: 8px;
      margin-bottom: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #settings-modal input[type="file"] {
      width: 100%;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .btn-group {
      text-align: center;
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }

    #settings-modal button {
      padding: 8px 12px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
    }
    #btn-save-bg { background-color: #4CAF50; color: white; }
    #btn-clear-bg { background-color: #f44336; color: white; }
    #btn-close-bg { background-color: #888; color: white; }

    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 19999;
    }
  </style>
</head>
<body>
  <main id="dashboard-shell">
    <header id="dashboard-toolbar">
      <h1 id="dashboard-title">SyncSticky Todo</h1>
      <div class="toolbar-actions">
        <button class="toolbar-btn" id="btn-add-note" type="button">Add Note</button>
        <button class="toolbar-btn secondary" id="fab-settings" type="button">BG</button>
      </div>
    </header>

    <section id="todo-board">
      <section class="todo-column" data-status="discussion">
        <div class="todo-column-header"><span>Discussion</span><span class="todo-count" data-count="discussion">0</span></div>
        <div class="todo-list" data-list="discussion"></div>
      </section>
      <section class="todo-column" data-status="waiting">
        <div class="todo-column-header"><span>Waiting</span><span class="todo-count" data-count="waiting">0</span></div>
        <div class="todo-list" data-list="waiting"></div>
      </section>
      <section class="todo-column" data-status="doing">
        <div class="todo-column-header"><span>Doing</span><span class="todo-count" data-count="doing">0</span></div>
        <div class="todo-list" data-list="doing"></div>
      </section>
      <section class="todo-column" data-status="done">
        <div class="todo-column-header"><span>Done</span><span class="todo-count" data-count="done">0</span></div>
        <div class="todo-list" data-list="done"></div>
      </section>
    </section>
  </main>

  <div id="modal-overlay"></div>
  <div id="settings-modal">
    <h3>Background Settings</h3>

    <h4>Option A: Upload image</h4>
    <input type="file" id="bg-file-input" accept="image/*">
    <p style="font-size: 11px; color: #999; margin: 2px 0;">Images are saved locally in this browser. Maximum size: 5 MB.</p>

    <hr style="border: 0; border-top: 1px dashed #ddd; margin: 15px 0;">

    <h4>Option B: Image URL</h4>
    <input type="text" id="bg-url-input" placeholder="Enter image URL...">

    <div class="btn-group">
      <button id="btn-save-bg">Save URL</button>
      <button id="btn-clear-bg">Clear</button>
      <button id="btn-close-bg">Close</button>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
