<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SyncSticky Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --dash-ink: #20231f;
      --dash-muted: #60675f;
      --dash-paper: #f6f2e8;
      --dash-panel: rgba(255,255,255,0.78);
      --dash-line: rgba(32,35,31,0.14);
      --dash-charcoal: #232522;
      --dash-teal: #0f766e;
      --dash-amber: #c98219;
      --dash-rust: #a33a2f;
      --dash-moss: #687a3d;
    }

    body {
      background-color: var(--dash-paper);
      background-image:
        linear-gradient(rgba(32,35,31,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32,35,31,0.04) 1px, transparent 1px);
      background-size: 22px 22px;
      background-attachment: fixed;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--dash-ink);
      font-family: "Bahnschrift", "Aptos", "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(120deg, rgba(15,118,110,0.1), transparent 34%),
        linear-gradient(315deg, rgba(201,130,25,0.14), transparent 38%);
      mix-blend-mode: multiply;
    }

    #dashboard-shell {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      box-sizing: border-box;
    }

    #dashboard-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      padding: 12px 14px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--dash-line);
      border-radius: 8px;
      box-shadow: 0 14px 32px rgba(32,35,31,0.12);
      backdrop-filter: blur(10px);
    }

    #dashboard-title {
      margin: 0;
      color: var(--dash-ink);
      font-size: 22px;
      line-height: 1.2;
      font-weight: 900;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .toolbar-btn {
      border: 1px solid var(--dash-charcoal);
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 800;
      background: var(--dash-charcoal);
      color: white;
      min-height: 36px;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .toolbar-btn:hover {
      transform: translateY(-1px);
      background: #111310;
    }

    .toolbar-btn.secondary {
      background: white;
      color: var(--dash-charcoal);
      border: 1px solid var(--dash-line);
      min-width: 44px;
    }

    #todo-board {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 12px;
      min-height: 0;
      flex-grow: 1;
      overflow: auto;
      padding-right: 2px;
    }

    #tab-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
      padding: 2px 0;
    }

    .tab-btn {
      border: 1px solid var(--dash-line);
      border-radius: 6px;
      padding: 8px 12px;
      min-height: 34px;
      background: rgba(255,255,255,0.76);
      color: var(--dash-charcoal);
      cursor: pointer;
      font-weight: 800;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--dash-charcoal);
      color: white;
      border-color: var(--dash-charcoal);
    }

    #board-settings-panel {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.74);
      border: 1px solid var(--dash-line);
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(32,35,31,0.1);
      backdrop-filter: blur(8px);
    }

    #board-settings-panel[hidden] {
      display: none;
    }

    .settings-section {
      min-width: 0;
    }

    .settings-section h2 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--dash-muted);
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .settings-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
    }

    .settings-row.status-row {
      grid-template-columns: auto minmax(0, 1fr) auto;
    }

    .settings-text {
      min-width: 0;
      height: 30px;
      border: 1px solid var(--dash-line);
      border-radius: 6px;
      padding: 0 8px;
      font-family: inherit;
      font-weight: 700;
    }

    .settings-color,
    .todo-color {
      width: 32px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--dash-line);
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    .settings-mini-btn {
      height: 30px;
      border: 1px solid var(--dash-line);
      border-radius: 6px;
      background: white;
      color: var(--dash-charcoal);
      cursor: pointer;
      font-weight: 800;
    }

    .settings-mini-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .column-resize-handle {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 5px;
      background:
        linear-gradient(135deg, transparent 48%, rgba(32,35,31,0.38) 50%, transparent 54%),
        linear-gradient(135deg, transparent 62%, rgba(32,35,31,0.28) 64%, transparent 68%);
      cursor: nwse-resize;
      opacity: 0.7;
    }

    .column-resize-handle:hover {
      opacity: 1;
      background-color: rgba(15,118,110,0.08);
    }

    .todo-column {
      background: var(--dash-panel);
      border: 1px solid var(--dash-line);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(32,35,31,0.1);
      backdrop-filter: blur(8px);
      position: relative;
      flex: 0 0 calc(24% - 12px);
    }

    .board-empty-state {
      width: 100%;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--dash-line);
      border-radius: 8px;
      background: rgba(255,255,255,0.58);
      color: var(--dash-muted);
      font-size: 14px;
      font-weight: 800;
    }

    .todo-column[data-status="discussion"] { border-top: 5px solid var(--dash-amber); }
    .todo-column[data-status="waiting"] { border-top: 5px solid var(--dash-rust); }
    .todo-column[data-status="doing"] { border-top: 5px solid var(--dash-teal); }
    .todo-column[data-status="done"] { border-top: 5px solid var(--dash-moss); }

    .todo-column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--dash-line);
      font-weight: 900;
      color: var(--dash-ink);
      text-transform: uppercase;
      font-size: 13px;
    }

    .todo-count {
      font-size: 12px;
      color: var(--dash-muted);
      font-weight: 700;
      text-transform: none;
    }

    .todo-list {
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      flex-grow: 1;
    }

    .todo-list-over {
      outline: 2px dashed rgba(15,118,110,0.55);
      outline-offset: -6px;
      background: rgba(15,118,110,0.08);
    }

    .todo-card {
      background: #fff7b1;
      color: var(--dash-ink);
      border: 1px solid rgba(32,35,31,0.16);
      border-radius: 8px;
      box-shadow: 0 9px 22px rgba(32,35,31,0.16);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .todo-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(32,35,31,0.18);
    }

    .todo-card-header {
      position: absolute;
      top: 7px;
      right: 7px;
      z-index: 2;
    }

    .todo-reminder-btn {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(32,35,31,0.18);
      border-radius: 6px;
      background: rgba(255,255,255,0.72);
      color: var(--dash-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
    }

    .todo-reminder-btn.active {
      background: var(--dash-charcoal);
      color: white;
      border-color: var(--dash-charcoal);
    }

    .todo-reminder-panel {
      position: absolute;
      top: 32px;
      right: 0;
      width: 218px;
      padding: 8px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(32,35,31,0.18);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(32,35,31,0.2);
    }

    .todo-reminder-panel[hidden] {
      display: none;
    }

    .todo-content {
      min-height: 64px;
      max-height: 160px;
      overflow-y: auto;
      outline: none;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .todo-content:focus {
      background: rgba(255,255,255,0.24);
      border-radius: 6px;
    }

    .todo-content:empty::before {
      content: "Empty note";
      color: #777;
    }

    .todo-meta {
      color: var(--dash-muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .todo-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto auto auto;
      gap: 6px;
      align-items: center;
    }

    .todo-status {
      width: 100%;
      min-width: 0;
      height: 28px;
      border: 1px solid rgba(32,35,31,0.18);
      border-radius: 6px;
      background: rgba(255,255,255,0.62);
      color: var(--dash-ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .todo-action-btn {
      border: 1px solid rgba(32,35,31,0.18);
      background: rgba(255,255,255,0.66);
      color: var(--dash-ink);
      border-radius: 6px;
      cursor: pointer;
      min-width: 36px;
      height: 28px;
      font-size: 12px;
      font-weight: 800;
    }

    .todo-action-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .todo-toggle {
      height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      border: 1px solid rgba(32,35,31,0.18);
      border-radius: 6px;
      background: rgba(255,255,255,0.66);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .todo-reminder {
      width: 100%;
      min-width: 0;
      height: 28px;
      border: 1px solid rgba(32,35,31,0.18);
      border-radius: 6px;
      background: rgba(255,255,255,0.62);
      color: var(--dash-ink);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
    }

    .todo-reminder-text {
      grid-column: 1 / -1;
      min-height: 13px;
      color: var(--dash-rust);
      font-size: 11px;
      font-weight: 800;
      text-align: right;
    }

    @media (max-width: 920px) {
      #board-settings-panel {
        grid-template-columns: 1fr;
      }

      .todo-actions {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto auto;
      }
    }

    #settings-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 18px 42px rgba(0,0,0,0.28);
      z-index: 20000;
      width: 420px;
      max-width: calc(100vw - 32px);
      text-align: left;
      font-family: "Bahnschrift", "Aptos", "Segoe UI", sans-serif;
    }

    #settings-modal h3 { margin-top: 0; color: var(--dash-ink); text-align: center; }
    #settings-modal h4 { margin: 15px 0 5px 0; font-size: 14px; color: var(--dash-muted); }

    #settings-modal input[type="text"] {
      width: 95%;
      padding: 8px;
      margin-bottom: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #settings-modal input[type="file"] {
      width: 100%;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .btn-group {
      text-align: center;
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
    }

    .settings-check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--dash-ink);
      font-size: 13px;
      font-weight: 800;
    }

    .settings-number-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      color: var(--dash-ink);
      font-size: 13px;
      font-weight: 800;
    }

    .settings-number-row input {
      height: 28px;
      border: 1px solid var(--dash-line);
      border-radius: 6px;
      padding: 0 6px;
      font-family: inherit;
      font-weight: 800;
    }

    .settings-url-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
      align-items: center;
    }

    .settings-url-row #bg-url-input {
      width: auto;
      margin-bottom: 0;
    }

    #settings-modal button {
      padding: 8px 12px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
    }
    .backup-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    #btn-save-bg,
    #btn-clear-bg {
      background-color: #0f766e;
      color: white;
      padding: 4px 7px;
      font-size: 11px;
      min-height: 24px;
    }
    #btn-clear-bg { background-color: #a33a2f; }
    #btn-close-bg { background-color: #666; color: white; }

    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 19999;
    }

    .create-note-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.42);
      z-index: 20998;
    }

    .create-note-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(520px, calc(100vw - 32px));
      display: grid;
      gap: 10px;
      padding: 18px;
      background: white;
      color: var(--dash-ink);
      border-radius: 8px;
      box-shadow: 0 18px 42px rgba(0,0,0,0.28);
      z-index: 20999;
      font-family: "Bahnschrift", "Aptos", "Segoe UI", sans-serif;
    }

    .create-note-modal h3 {
      margin: 0;
      font-size: 18px;
    }

    .create-note-field,
    .create-note-color {
      min-height: 32px;
      border: 1px solid var(--dash-line);
      border-radius: 6px;
      padding: 0 8px;
      font-family: inherit;
      font-weight: 800;
    }

    .create-note-color {
      width: 54px;
      padding: 0;
    }

    .create-note-editor {
      min-height: 150px;
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid var(--dash-line);
      border-radius: 8px;
      padding: 10px;
      line-height: 1.45;
      outline: none;
      background: #fffdf3;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .create-note-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--dash-muted);
    }

    .create-note-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .create-note-actions button {
      min-height: 32px;
      border: 1px solid var(--dash-line);
      border-radius: 6px;
      padding: 0 12px;
      background: white;
      color: var(--dash-charcoal);
      cursor: pointer;
      font-weight: 900;
    }

    .create-note-actions button.primary {
      background: var(--dash-charcoal);
      color: white;
      border-color: var(--dash-charcoal);
    }
  </style>
</head>
<body>
  <main id="dashboard-shell">
    <header id="dashboard-toolbar">
      <h1 id="dashboard-title">SyncSticky Todo</h1>
      <div class="toolbar-actions">
        <button class="toolbar-btn" id="btn-add-note" type="button">Add Note</button>
        <button class="toolbar-btn secondary" id="btn-board-settings" type="button">Board</button>
        <button class="toolbar-btn secondary" id="fab-settings" type="button">Settings</button>
      </div>
    </header>

    <nav id="tab-bar" aria-label="Board tabs"></nav>

    <section id="board-settings-panel" hidden>
      <section class="settings-section">
        <h2>Tabs</h2>
        <div class="settings-list" id="tab-settings-list"></div>
        <button class="settings-mini-btn" id="btn-add-tab" type="button">Add Tab</button>
      </section>
      <section class="settings-section">
        <h2>Statuses</h2>
        <div class="settings-list" id="status-settings-list"></div>
        <button class="settings-mini-btn" id="btn-add-status" type="button">Add Status</button>
      </section>
    </section>

    <section id="todo-board"></section>
  </main>

  <div id="modal-overlay"></div>
  <div id="settings-modal">
    <h3>Settings</h3>

    <h4>Background image</h4>
    <input type="file" id="bg-file-input" accept="image/*">
    <p style="font-size: 11px; color: #999; margin: 2px 0;">Images are saved locally in this browser. Maximum size: 5 MB.</p>

    <div class="settings-url-row">
      <input type="text" id="bg-url-input" placeholder="Enter image URL...">
      <button id="btn-save-bg" type="button">Save URL</button>
      <button id="btn-clear-bg" type="button">Clear</button>
    </div>

    <hr style="border: 0; border-top: 1px dashed #ddd; margin: 15px 0;">

    <h4>Controls</h4>
    <label class="settings-check-row">
      <input type="checkbox" id="add-button-enabled-input">
      <span>Show add button on web pages</span>
    </label>
    <label class="settings-check-row">
      <input type="checkbox" id="character-enabled-input">
      <span>Show characters on sticky note pages</span>
    </label>
    <label class="settings-number-row">
      <span>Character count</span>
      <input type="number" id="character-count-input" min="1" max="5" step="1">
    </label>

    <hr style="border: 0; border-top: 1px dashed #ddd; margin: 15px 0;">

    <h4>Backup</h4>
    <input type="file" id="import-file-input" accept="application/json" hidden>
    <div class="backup-actions">
      <button id="btn-export-data" type="button">Export</button>
      <button id="btn-import-data" type="button">Import</button>
    </div>

    <div class="btn-group">
      <button id="btn-close-bg">Close</button>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
